<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto</title>
</head>

<body>
    <header>
        <div class="div-logo"><a class="logo" href="../index.html">Salem Snacks</a></div>

        <nav class="header-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
      <section class="contacto">
      <h1 class="titulo-contacto text-secondary">Contactanos</h1>
      <form class="form-contacto" action="https://formspree.io/f/xyeglwnn" method="POST">
        <div class="grupo-input">
          <label for="email"> Tu correo</label>
          <input id="email" type="email" name="email" required />
        </div>

        <div class="grupo-input">
          <label for="mensaje"> Tu mensaje</label>
          <textarea id="mensaje" name="message" required></textarea>
        </div>
        <button class="btn bg-secondary text-dark" type="submit">Enviar</button>
      </form>
      </section> 
    </main>

    <footer>
      <p>Sitio realizado por Catherine Tupia Caypo para Talento Tech</p>
         <nav>
        <ul class="footer-list">
          <li><img src="../img/whatsapp.jpg" alt="logo-whatsapp" /> </li>
          <li><img src="../img/instagram.jpg" alt="logo-instagram" /></li>
        </ul>
      </nav>
    </footer>
</body>
</html>
